name: Eski Derlemeleri Temizle

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Her gece 00:00'da calisir
  workflow_run:
    workflows: ["Otomatik APK Derle ve Yayinla"]
    types: [completed]

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Son 4 Derleme Haricindekileri Sil
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 4
