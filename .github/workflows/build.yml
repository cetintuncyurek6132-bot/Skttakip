name: Otomatik APK Derle ve Yayinla

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi Cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Hizli Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Hizlandirilmis APK Derle
        run: |
          gradle assembleDebug \
            -Pandroid.injected.version.code=${{ github.run_number }} \
            -Pandroid.injected.version.name="1.0.${{ github.run_number }}" \
            -x lint \
            -x test \
            --parallel \
            --build-cache

      - name: Surum Etiketi Olustur
        id: tagger
        run: echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: GitHub Release Olarak Yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.TAG_NAME }}
          name: "Surum ${{ steps.tagger.outputs.TAG_NAME }}"
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Eski Surumleri Temizle (Son 2 Surumu Tut)
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 2
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
