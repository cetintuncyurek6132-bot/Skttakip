name: Otomatik APK Derle ve Yayinla

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Hizli Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: local.properties Olustur
        run: touch local.properties

      - name: Sabit Debug Keystore Hazirla
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SKTTakip,OU=Retail,O=Store,L=Istanbul,ST=TR,C=TR"
          fi
          cp debug.keystore ~/.android/debug.keystore

      - name: Surum Numarasi Hesapla
        id: calc_version
        run: |
          RUN_NUM=${{ github.run_number }}
          # Her 10 derlemede bir major sürüm atlasın (1.0 - 1.9 -> 2.0 - 2.9 -> 3.0...)
          MAJOR=$(( 1 + RUN_NUM / 10 ))
          MINOR=$(( RUN_NUM % 10 ))
          VERSION_NAME="${MAJOR}.${MINOR}"
          echo "APP_VERSION=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=v${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Hizlandirilmis APK Derle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          gradle assembleDebug \
            -Pandroid.injected.version.code=${{ github.run_number }} \
            -Pandroid.injected.version.name="${{ env.APP_VERSION }}" \
            -x lint \
            -x test \
            --build-cache \
            --parallel

      - name: GitHub Release Olarak Yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.calc_version.outputs.TAG_NAME }}
          name: "Sürüm ${{ steps.calc_version.outputs.TAG_NAME }}"
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
