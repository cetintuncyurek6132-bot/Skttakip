name: Otomatik APK Derle ve Yayinla

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Hizli Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Hizlandirilmis APK Derle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          gradle assembleDebug \
            -Pandroid.injected.version.code=${{ github.run_number }} \
            -Pandroid.injected.version.name="1.0.${{ github.run_number }}" \
            -x lint \
            -x lintVitalRelease \
            -x test \
            -x mockableAndroidJar \
            --build-cache \
            --parallel

      - name: Surum Etiketi Olustur
        id: tagger
        run: echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: GitHub Release Olarak Yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.TAG_NAME }}
          name: "Surum ${{ steps.tagger.outputs.TAG_NAME }}"
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
