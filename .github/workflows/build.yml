name: Otomatik APK Derle ve Yayinla

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Hizli Gradle Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: local.properties Olustur
        run: touch local.properties

      - name: Sabit Debug Keystore Hazirla
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            cp ~/.android/debug.keystore ./debug.keystore
          else
            echo "HATA: DEBUG_KEYSTORE_BASE64 secret'i tanimli degil!"
            exit 1
          fi

      - name: Surum Numarasi Hesapla
        id: calc_version
        run: |
          RUN_NUM=${{ github.run_number }}
          MAJOR=$(( 1 + RUN_NUM / 10 ))
          MINOR=$(( RUN_NUM % 10 ))
          VERSION_NAME="beta ${MAJOR}.${MINOR}"
          TAG_NAME="v${MAJOR}.${MINOR}"
          echo "APP_VERSION=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Hizlandirilmis APK Derle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"
        run: |
          gradle assembleDebug \
            -Pandroid.injected.version.code=${{ github.run_number }} \
            -Pandroid.injected.version.name="${{ env.APP_VERSION }}" \
            -x lint \
            -x test \
            --build-cache \
            --parallel

      - name: Guncelleme Notunu Hazirla
        id: notes
        run: |
          LAST_MSG=$(git log -1 --pretty=%B | head -n 1)
          if [ -z "$LAST_MSG" ]; then
            LAST_MSG="Kucuk iyilestirmeler ve hata duzeltmeleri yapildi."
          fi
          {
            echo "NOTES<<EOF"
            echo "$LAST_MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: GitHub Release Olarak Yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.calc_version.outputs.TAG_NAME }}
          name: "Sürüm ${{ env.APP_VERSION }}"
          body: ${{ steps.notes.outputs.NOTES }}
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
