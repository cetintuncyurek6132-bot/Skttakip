name: TEK SEFERLIK - Sabit Keystore Uret

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Keystore Uret
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SKTTakip,OU=Retail,O=Store,L=Istanbul,ST=TR,C=TR"
          echo "===== ASAGIDAKI UZUN METNI KOPYALA (BASLANGIC) ====="
          base64 -w 0 debug.keystore
          echo ""
          echo "===== YUKARIDAKI UZUN METNI KOPYALA (BITIS) ====="
